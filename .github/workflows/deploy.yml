name: Sync and Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. Please add it in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi
          if [ -z "$HF_SPACE_REPO" ]; then
            echo "HF_SPACE_REPO secret is not set. Example: Whyzenn07/neural-book-software"
            exit 1
          fi
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions"
          git remote add space "https://$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO"
          git push --force space main
